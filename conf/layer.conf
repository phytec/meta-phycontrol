# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-phycontrol"
BBFILE_PATTERN_meta-phycontrol = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-phycontrol = "6"

LAYERDEPENDS_meta-phycontrol = "core phytec ampliphy"
LAYERSERIES_COMPAT_meta-phycontrol = "scarthgap"
